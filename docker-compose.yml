services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbrew
      MYSQL_USER: dbrew
      MYSQL_PASSWORD: dbrew-local
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "3306:3306"
    volumes:
      - dbrew-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-local"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  dbrew-data:
